<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도면 3D 뷰어</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --fg: #222; --muted: #7a7873; --line: #e4e1db;
    --accent: #5f7d14; --accent-soft: #eef3e0; --stage: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181a; --panel: #1f2023; --fg: #ecebe8; --muted: #9a9893; --line: #2f3034;
      --accent: #a9c95a; --accent-soft: #2a3220; --stage: #ffffff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181a; --panel: #1f2023; --fg: #ecebe8; --muted: #9a9893; --line: #2f3034;
    --accent: #a9c95a; --accent-soft: #2a3220; --stage: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; display: grid; grid-template-columns: 300px 1fr; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; height: 100vh; position: sticky; top: 0; }
  aside header { padding: 20px 16px 12px; }
  aside h1 { font-size: 17px; margin: 0 0 2px; }
  aside p { margin: 0; color: var(--muted); font-size: 12px; }
  .group h2 { font-size: 11px; letter-spacing: .04em; color: var(--muted); margin: 16px 16px 6px; font-weight: 600; }
  .item { display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: center; width: 100%; padding: 6px 16px; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; font: inherit; }
  .item img { width: 72px; height: 50px; object-fit: contain; background: #fff; border-radius: 6px; border: 1px solid var(--line); }
  .item b { display: block; font-size: 13px; font-weight: 600; }
  .item span { color: var(--muted); font-size: 12px; }
  .item:hover { background: var(--accent-soft); }
  .item[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .title b { font-size: 16px; }
  .title span { color: var(--muted); margin-left: 8px; font-size: 13px; }
  .tabs { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .tabs button { border: 0; background: none; color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 13px; }
  .tabs button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 600; }
  .nav { display: flex; gap: 6px; }
  .nav button, .nav a { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 13px; text-decoration: none; }
  .stage { flex: 1; min-height: 0; background: var(--stage); position: relative; }
  .stage iframe { width: 100%; height: 100%; border: 0; display: block; }
  .stage .img { width: 100%; height: 100%; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .stage .img img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
  .compare figure { margin: 0; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid #eee; }
  .compare figcaption { font-size: 12px; color: #777; padding: 8px 12px; }
  .compare img { flex: 1; min-height: 0; width: 100%; object-fit: contain; padding: 8px; }
  .hint { position: absolute; left: 16px; bottom: 12px; font-size: 12px; color: #888; pointer-events: none; }
  .meta { padding: 10px 20px; border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .meta a { color: var(--accent); }
  .mobile-pick { display: none; }
  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; }
    aside { display: none; }
    main { height: auto; min-height: 100vh; }
    .bar { padding: 12px 16px; }
    .mobile-pick { display: block; width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: inherit; }
    .stage { height: 70vh; flex: none; }
    .compare { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .meta { padding: 10px 16px; }
  }
</style>
</head>
<body>
<aside>
  <header>
    <h1>도면 3D 뷰어</h1>
    <p>평면도 13장을 아이소메트릭 3D로 옮긴 결과</p>
  </header>
  <nav id="list"></nav>
</aside>
<main>
  <div class="bar">
    <select class="mobile-pick" id="pick" aria-label="도면 선택"></select>
    <div class="title"><b id="t"></b><span id="cat"></span></div>
    <div class="tabs" role="group" aria-label="보기 방식">
      <button data-view="3d">3D</button>
      <button data-view="render">렌더 이미지</button>
      <button data-view="original">원본 도면</button>
      <button data-view="compare">비교</button>
    </div>
    <div class="nav">
      <button id="prev" aria-label="이전 도면">←</button>
      <button id="next" aria-label="다음 도면">→</button>
      <a id="open" target="_blank" rel="noopener">새 탭</a>
    </div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="meta" id="meta"></div>
</main>
<script>
const SRC = 'https://eseo314.com/complex/';
const ITEMS = [
  { id: 'neighborhood_B1F', group: '근린생활시설 평면도', name: '지하 1층', desc: '주차장 · 램프 · 상가', orig: 'neighborhood/B1F.webp', page: 'neighborhood' },
  { id: 'neighborhood_1F', group: '근린생활시설 평면도', name: '1층', desc: '상가 · 로비 라운지', orig: 'neighborhood/1F.webp', page: 'neighborhood' },
  { id: 'neighborhood_2F', group: '근린생활시설 평면도', name: '2층', desc: '피트니스 · 커뮤니티 · 세탁실', orig: 'neighborhood/2F.webp', page: 'neighborhood' },
  { id: 'floor_3F', group: '층별 호수 배치도', name: '3층', desc: '52 · 64 · 18A · 18B · 19 TYPE', orig: 'floor/3F.webp', page: 'floor' },
  { id: 'floor_4-18F', group: '층별 호수 배치도', name: '4~18층', desc: '기준층 · 42 · 49 · 18A · 18B · 19 TYPE', orig: 'floor/4-18F.webp', page: 'floor' },
  { id: 'floor_19F', group: '층별 호수 배치도', name: '19층', desc: '42 · 49 · 18A · 18B · 19 TYPE', orig: 'floor/19F.webp', page: 'floor' },
  { id: 'floor_20F', group: '층별 호수 배치도', name: '20층', desc: '옥상정원 · 18A · 19 · 37 TYPE', orig: 'floor/20F.webp', page: 'floor' },
  { id: 'unit_18A-type', group: '단위세대 평면', name: '18A TYPE', desc: '청년형 원룸', orig: 'unit/18A-type.webp', page: 'unit' },
  { id: 'unit_18B-type', group: '단위세대 평면', name: '18B TYPE', desc: '청년형 원룸', orig: 'unit/18B-type.webp', page: 'unit' },
  { id: 'unit_19-type', group: '단위세대 평면', name: '19 TYPE', desc: '청년형 원룸', orig: 'unit/19-type.webp', page: 'unit' },
  { id: 'unit_37-type', group: '단위세대 평면', name: '37 TYPE', desc: '신혼부부형 · 침실 1', orig: 'unit/37-type.webp', page: 'unit' },
  { id: 'unit_42-type', group: '단위세대 평면', name: '42 TYPE', desc: '신혼부부형 · 침실 1', orig: 'unit/42-type.webp', page: 'unit' },
  { id: 'unit_49-type', group: '단위세대 평면', name: '49 TYPE', desc: '신혼부부형 · 침실 2', orig: 'unit/49-type.webp', page: 'unit' },
];
const VIEWS = ['3d', 'render', 'original', 'compare'];
const $ = (id) => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

let view = VIEWS.includes(store.get('view')) ? store.get('view') : '3d';
let cur = 0;

// 목록
const list = $('list'), pick = $('pick');
[...new Set(ITEMS.map(i => i.group))].forEach(g => {
  const sec = document.createElement('div'); sec.className = 'group';
  sec.innerHTML = `<h2>${g}</h2>`;
  const og = document.createElement('optgroup'); og.label = g;
  ITEMS.forEach((it, i) => {
    if (it.group !== g) return;
    const b = document.createElement('button');
    b.className = 'item'; b.dataset.i = i;
    b.innerHTML = `<img src="3d/thumbs/${it.id}_3d.jpg" alt="" loading="lazy"><div><b>${it.name}</b><span>${it.desc}</span></div>`;
    b.onclick = () => go(i);
    sec.appendChild(b);
    const o = document.createElement('option'); o.value = i; o.textContent = `${it.name} — ${it.desc}`; og.appendChild(o);
  });
  list.appendChild(sec); pick.appendChild(og);
});
pick.onchange = () => go(+pick.value);

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { view = b.dataset.view; store.set('view', view); render(); });
$('prev').onclick = () => go((cur - 1 + ITEMS.length) % ITEMS.length);
$('next').onclick = () => go((cur + 1) % ITEMS.length);
addEventListener('keydown', (e) => {
  if (e.target.closest('select')) return;
  if (e.key === 'ArrowLeft') $('prev').click();
  if (e.key === 'ArrowRight') $('next').click();
});

function go(i) { cur = i; history.replaceState(null, '', '#' + ITEMS[i].id); render(); }

function render() {
  const it = ITEMS[cur];
  const page = `3d/${it.id}_3d.html`, png = `3d/${it.id}_3d_labeled.png`;
  document.querySelectorAll('.item').forEach(b => b.setAttribute('aria-current', +b.dataset.i === cur));
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === view));
  pick.value = cur;
  $('t').textContent = it.name;
  $('cat').textContent = it.group;
  document.title = `${it.name} · 도면 3D 뷰어`;
  $('open').href = view === 'original' ? it.orig : view === '3d' ? page : png;

  const st = $('stage');
  if (view === '3d') st.innerHTML = `<iframe src="${page}" title="${it.name} 3D"></iframe><div class="hint">드래그로 회전 · 스크롤로 확대</div>`;
  else if (view === 'render') st.innerHTML = `<div class="img"><img src="${png}" alt="${it.name} 3D 렌더"></div>`;
  else if (view === 'original') st.innerHTML = `<div class="img"><img src="${it.orig}" alt="${it.name} 원본 도면"></div>`;
  else st.innerHTML = `<div class="compare"><figure><figcaption>원본 도면</figcaption><img src="${it.orig}" alt="${it.name} 원본 도면"></figure><figure><figcaption>3D</figcaption><img src="${png}" alt="${it.name} 3D 렌더"></figure></div>`;

  $('meta').innerHTML = `<span>${it.desc}</span><span>원본: <a href="${SRC}${it.page}" target="_blank" rel="noopener">eseo314.com/complex/${it.page}</a></span><span>파일: ${it.orig}</span><span>${cur + 1} / ${ITEMS.length}</span>`;
}

const fromHash = () => ITEMS.findIndex(i => '#' + i.id === location.hash);
addEventListener('hashchange', () => { const i = fromHash(); if (i >= 0 && i !== cur) go(i); });
go(Math.max(0, fromHash()));
</script>
</body>
</html>
